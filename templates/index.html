<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clovers × Sneak Attack</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<style>
:root{
  --green:#22c55e;
  --dark:#0f0f0f;
  --card:#18181b;
  --orange:#f97316;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family: Inter, system-ui, sans-serif;
  background:var(--dark);
  color:white;
  min-height:100vh;
}

/* HEADER */

.header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  padding:20px;
  border-bottom:1px solid #27272a;
}

.header img{
  height:50px;
}

.brand{
  font-size:18px;
  font-weight:700;
  letter-spacing:1px;
}

/* CARD */

.card{
  width:100%;
  max-width:520px;
  margin:40px auto;
  background:var(--card);
  padding:28px;
  border-radius:20px;
  border:1px solid #27272a;
}

/* INPUTS */

form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

input{
  padding:14px;
  border-radius:12px;
  border:1px solid #27272a;
  background:#111;
  color:white;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:var(--green);
}

/* ORDER TYPES */

.types{
  display:flex;
  gap:10px;
}

.types input{display:none}

.types label{
  flex:1;
  padding:14px;
  text-align:center;
  background:#111;
  border:1px solid #27272a;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}

.types input:checked + label{
  background:var(--green);
  border-color:var(--green);
  color:black;
}

/* BUTTON */

button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--orange);
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

button:hover{opacity:.85}

/* THANK YOU */

.big-number{
  font-size:60px;
  font-weight:800;
  text-align:center;
  color:var(--green);
  margin:20px 0;
}

/* QUEUE TABLE */

.table-wrap{
  max-width:900px;
  margin:40px auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px;
  border-bottom:1px solid #27272a;
  text-align:left;
}

th{
  color:#9ca3af;
  font-weight:600;
}

.badge{
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.pending{background:#facc15;color:black}
.done{background:var(--green);color:black}

.center{text-align:center}
</style>
</head>

<body>

<div class="header">
  <img src="/static/clovers.jpg">
  <div class="brand">CLOVERS × SNEAK ATTACK</div>
  <img src="/static/sneakattack.jpg">
</div>

{% if page == "form" %}
<div class="card">
<h2 class="center" style="margin-bottom:20px;">Place Your Order</h2>

<form method="POST" action="/submit"
onsubmit="timestamp.value=new Date().toISOString().slice(0,19).replace('T',' ')">

<input name="name" placeholder="Full Name" required>
<input name="email" placeholder="Email (gmail.com or up.edu.ph)">
<input name="facebook" placeholder="Facebook Profile Link">

<div class="types">
  <input type="radio" name="order_type" value="Stickers" id="t1" required>
  <label for="t1">Stickers</label>

  <input type="radio" name="order_type" value="Charm Bracelet" id="t2">
  <label for="t2">Bracelet</label>

  <input type="radio" name="order_type" value="Photo Booth" id="t3">
  <label for="t3">Photobooth</label>
</div>

<input name="quantity" type="number" min="1" placeholder="Quantity" required>
<input name="amount" type="number" min="0" placeholder="Amount Paid" required>
<input type="hidden" name="timestamp">

<button>Submit Order</button>
</form>
</div>

{% elif page == "thanks" %}
<div class="card center">
<h2>You’re in the Queue</h2>
<div class="big-number">{{ position }}</div>
<a href="/queue"><button style="width:100%;">View Live Queue</button></a>
</div>

{% elif page == "queue" %}
<div class="table-wrap">
<h2 class="center" style="margin-bottom:20px;">Live Queue</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>Name</th>
<th>Type</th>
<th>Qty</th>
</tr>
</thead>
<tbody id="queue-body"></tbody>
</table>
</div>

{% elif page == "admin" %}
<div class="table-wrap">
<h2 class="center" style="margin-bottom:20px;">Admin Dashboard</h2>
<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Type</th>
<th>Qty</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="admin-body"></tbody>
</table>
</div>
{% endif %}

<script>
const socket=io();

socket.on("queue_update",data=>{

if(location.pathname==="/queue"){
let body=document.getElementById("queue-body");
body.innerHTML="";
data.pending.forEach((o,i)=>{
body.innerHTML+=`
<tr>
<td>${i+1}</td>
<td>${o.Name}</td>
<td>${o["Order Type"]}</td>
<td>${o.Quantity}</td>
</tr>`
})
}

if(location.pathname==="/dashboard"){
let body=document.getElementById("admin-body");
body.innerHTML="";
data.all.forEach(o=>{
body.innerHTML+=`
<tr>
<td>${o.ID}</td>
<td>${o.Name}</td>
<td>${o["Order Type"]}</td>
<td>${o.Quantity}</td>
<td><span class="badge ${o.Status==="Pending"?"pending":"done"}">${o.Status}</span></td>
<td>
<form method="POST" action="/toggle/${o.ID}"><button>Done</button></form>
</td>
</tr>`
})
}
})
</script>

</body>
</html>
