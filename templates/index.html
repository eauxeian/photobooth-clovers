<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Clovers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    Photobooth Clovers
</header>

<nav class="topnav">
    <a href="/">Order</a>
    <a href="/queue">Queue</a>
    <a href="/admin">Admin Dashboard</a>
</nav>

<div class="container">

    <h2>Place an Order</h2>

    <div class="products">
        <div class="product">
            <img src="{{ url_for('static', filename='images/stickers.jpg') }}" alt="Stickers">
            <p>Stickers</p>
        </div>

        <div class="product">
            <img src="{{ url_for('static', filename='images/bracelet.jpg') }}" alt="Charm Bracelet">
            <p>Charm Bracelet</p>
        </div>

        <div class="product">
            <img src="{{ url_for('static', filename='images/photobooth.jpg') }}" alt="Photo Booth">
            <p>Photo Booth</p>
        </div>
    </div>

    <form action="/submit" method="POST">

        <label>Facebook Profile Link</label>
        <input type="text" name="facebook" placeholder="https://facebook.com/yourname" required>

        <label>Order Type</label>
        <select name="order_type" required>
            <option value="">Select an option</option>
            <option value="Stickers">Stickers</option>
            <option value="Charm Bracelet">Charm Bracelet</option>
            <option value="Photo Booth">Photo Booth</option>
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" min="1" required>

        <button type="submit">Submit Order</button>

    </form>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
